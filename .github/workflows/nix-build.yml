name: nix-build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Build the distributable flake package per platform and push to Cachix
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-darwin
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: paintera
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: |
          if ! nix build .#packages.${{ matrix.system }}.default 2>build-err.log; then
            hash=$(grep -oP 'got:\s+\K\S+' build-err.log || true)
            if [ -n "$hash" ]; then
              echo "### ⚠️ mvnHash mismatch for \`${{ matrix.system }}\`" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "${{ matrix.system }} = \"$hash\";" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "::error::mvnHash mismatch for ${{ matrix.system }}. Correct hash: $hash"
              exit 1
            else
              cat build-err.log >&2
              exit 1
            fi
          fi
